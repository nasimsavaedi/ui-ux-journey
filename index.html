<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Professional Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="theme-toggle">
    <img src="sun.svg" id="theme-icon" alt="Toggle Theme">
</div>

        <div class="card" data-tilt data-tilt-max="10" data-tilt-speed="400" data-tilt-glare data-tilt-max-glare="0.5">
        <div class="avatar-container">
            <img src="avatar.png" alt="Profile Picture" class="avatar">
        </div>

        <div class="info">
            <h1>Nasim Savaedi</h1>
            <p>Computer Engineering Student | UI/UX Explorer</p>
        </div>

        <button class="connect-btn">Let's Connect!</button>

        <div class="socials">
            <a href="https://github.com/YOUR_USERNAME" target="_blank">
                <img src="github.png" alt="GitHub">
            </a>
            <a href="mailto:YOUR_EMAIL@gmail.com">
                <img src="gmail.png" alt="Gmail">
            </a>
            <a href="#" target="_blank">
                <img src="instagram.png" alt="Instagram">
            </a>
            <a href="#" target="_blank">
                <img src="telegram.png" alt="telegram"
            </a> 
        </div>
    </div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
<script src="script.js"></script>
</body>
</html>
