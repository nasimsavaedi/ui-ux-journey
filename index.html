<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nasim's Interactive Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="theme-toggle"><img src="sun.svg" id="theme-icon"></div>

    <div class="card-container">
        <div class="card" id="main-card">
            
            <div class="card-face card-front">
                <div class="top-content">
                    <img src="avatar.png" class="avatar">
                    <h1>Nasim Savaedi</h1>
                    <p>Computer Engineering Student</p>
                    <div class="socials">
                        <a href="https://github.com/nasimsavaedi"><i class="fab fa-github"></i></a>
                        <a href="nasim.savaedi@gmail.com"><i class="fas fa-envelope"></i></a>
                        <a href="https://www.instagram.com/nasimsvdi?igsh=MjNvcDhwMjN0NnR3"><i class="fab fa-instagram"></i></a>
                        <a href="t.me/nasimsvdi"><i class="fab fa-telegram"></i></a>
                    </div>
                </div>
                <button class="flip-btn" onclick="flipCard()">About Me</button>
            </div>

            <div class="card-face card-back">
                <div class="top-content">
                    <h2>About Me</h2>
                    <p class="bio">I am a <b>Computer Engineering</b> student with a passion for <b>UI/UX Design</b>. I love creating beautiful and interactive digital experiences. 🚀</p>
                    <div class="skills">
                        <span>🌐 HTML</span> <span>🎨 CSS</span> <span>⚡ JS</span>
                    </div>
                </div>
                <button class="flip-btn" onclick="flipCard()">Back</button>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
